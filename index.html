<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Alafia Amani</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FFF8F0;
      --bg2:       #F5F5F5;
      --bg3:       #FFE8D0;
      --accent:    #FF8A3D;
      --accent2:   #E63946;
      --blue:      #06AED5;
      --teal:      #2EC4B6;
      --yellow:    #FFD166;
      --purple:    #9381FF;
      --text:      #2D3142;
      --muted:     #8A8FA8;
      --card:      #FFFFFF;
      --radius:    16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      /* overflow: hidden; */
      overflow: visible;
    }

    /* soft glow behind SOS */
    .shell::before {
      content: '';
      position: absolute;
      top: 220px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255,138,61,0.13) 0%, transparent 70%);
      pointer-events: none;
      border-radius: 50%;
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 10px;
    }

    .app-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 3px 10px rgba(255,138,61,0.3);
    }
    .logo-text {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }
    .logo-text span { color: var(--accent); }

    .lang-row {
      display: flex;
      gap: 6px;
    }
    .lang-pill {
      background: var(--bg2);
      border: 1px solid #E8EAF0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-pill.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      text-decoration: none;
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--bg3);
      border: 2.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      transition: transform 0.15s;
    }
    .avatar:active { transform: scale(0.93); }
    .avatar-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    /* ── Greeting ── */
    .greeting {
      padding: 6px 22px 18px;
    }
    .greeting-small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .greeting-name  { color: var(--text);  font-size: 22px; font-weight: 900; }

    /* ── SOS zone ── */
    .sos-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 22px 24px;
    }

    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.5; }
      70%  { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .sos-outer-ring {
      position: relative;
      width: 180px; height: 180px;
    }
    .sos-outer-ring::before,
    .sos-outer-ring::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid var(--accent2);
      animation: pulse-ring 2.2s ease-out infinite;
    }
    .sos-outer-ring::after { animation-delay: 1.1s; }

    .sos-btn {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: var(--accent2);
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 48px rgba(230,57,70,0.38);
      text-decoration: none;
      overflow: hidden;
      padding: 0 20px;
    }
    .sos-btn:active { transform: scale(0.95); }

    /* .sos-emoji { font-size: 34px; line-height: 1; margin-bottom: 4px; } */
    .sos-label { color: #fff; font-size: 25px; font-weight: 900; text-align: center; line-height: 1.2; padding: 0 14px; }
    .sos-sub   { color: rgba(255,255,255,0.72); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; margin-top: 5px; }

    .sos-hint {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      margin-top: 12px;
      text-align: center;
    }

    /* ── 3 action buttons ── */
    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 18px 24px;
    }

    .action-btn {
      flex: 1;
      max-width: 110px;
      background: var(--card);
      border: 1.5px solid #E8EAF0;
      border-radius: 20px;
      padding: 16px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(45,49,66,0.07);
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active { transform: scale(0.95); box-shadow: none; }

    .action-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .action-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      line-height: 1.3;
    }

    .btn-talk     .action-icon { background: #E0F7FA; }
    .btn-tips     .action-icon { background: #FFF8E1; }
    .btn-handbook .action-icon { background: #F3E5FF; }
    .btn-talk     { border-color: #B2EBF2; }
    .btn-tips     { border-color: #FFE082; }
    .btn-handbook { border-color: #D1C4FF; }

    /* ── Emergency banner ── */
    .emerg-banner {
      margin: 0 16px 16px;
      background: #DC143C;
      border: 1px solid #DC143C;
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .emerg-banner:active { background: #a00e2b; }
    .emerg-icon { font-size: 22px; }
    .emerg-text strong { color: #fff; font-size: 13px; font-weight: 800; display: block; }
    .emerg-text span   { color: rgba(255,255,255,0.82); font-size: 11px; font-weight: 600; }
    .emerg-arrow { margin-left: auto; color: #fff; font-size: 18px; }

    /* ── Tab bar ── */
    .tab-bar {
      margin-top: auto;
      display: flex;
      justify-content: space-around;
      padding: 12px 0 28px;
      border-top: 1px solid #EDE8E0;
      background: var(--bg);
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-icon  { font-size: 20px; }
    .tab-label { font-size: 9px; font-weight: 700; }
    .tab.active .tab-label { color: var(--accent); }
    .tab:not(.active) .tab-label { color: var(--muted); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
